<!DOCTYPE html>
<html>
<head>
    <title>Report Incident</title>
    <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
    <style>
    :root {
        --primary: #1B3C53;
        --secondary: #234C6A;
        --accent: #456882;
        --bg: #eef3f7;
        --card: #ffffff;
        --radius: 10px;
        --shadow: 0 6px 15px rgba(0, 0, 0, 0.08);
    }

    body {
        font-family: 'Segoe UI', Tahoma, sans-serif;
        background: linear-gradient(135deg, #eef3f7, #dbe6ea);
        max-width: 800px;
        margin: 0 auto;
        padding: 0;
    }

    /* Top blue line */
    body::before {
        content: "";
        display: block;
        height: 6px;
        background: linear-gradient(to right, var(--primary), var(--secondary));
        border-radius: 0 0 6px 6px;
        margin-bottom: 20px;
    }

    h1 {
        text-align: center;
        color: var(--primary);
        margin-bottom: 20px;
    }

    form {
        background: var(--card);
        padding: 25px;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
    }

    label {
        font-weight: 600;
        color: var(--primary);
        margin-top: 12px;
        display: block;
    }

    input, textarea {
        width: 100%;
        padding: 10px 12px;
        margin: 6px 0 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
        box-sizing: border-box;
    }

    input:focus, textarea:focus {
        outline: none;
        border-color: var(--secondary);
        box-shadow: 0 0 0 2px rgba(35, 76, 106, 0.15);
    }

    button {
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        color: white;
        padding: 12px 22px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        margin: 10px 0;
        font-weight: 600;
        transition: 0.3s ease;
    }

    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    }

    /* Suggestions */
    #suggestions {
        border: 1px solid #ccc;
        background: white;
        max-height: 200px;
        overflow-y: auto;
        border-radius: 6px;
        box-shadow: var(--shadow);
    }

    .suggestion-item {
        padding: 10px;
        cursor: pointer;
        border-bottom: 1px solid #eee;
    }

    .suggestion-item:hover {
        background-color: #eef3f7;
    }

    /* Location options */
    .location-options {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 10px;
    }

    .secondary-btn {
        background: linear-gradient(135deg, #456882, #234C6A);
    }

    .secondary-btn:hover {
        opacity: 0.95;
    }

    /* Manual coordinates */
    .manual-coords {
        display: none;
        margin-top: 10px;
        padding: 15px;
        background: #f1f5f9;
        border-radius: 8px;
    }

    .coord-input {
        width: 48%;
        display: inline-block;
    }

    /* Selected location */
    .selected-location {
        background: #e8f1f7;
        padding: 12px;
        margin: 10px 0;
        border-left: 4px solid var(--primary);
        border-radius: 6px;
    }

    .info-text {
        color: #555;
        font-size: 14px;
    }
</style>

</head>
<body>
    <h1>Report Incident</h1>

    <form id="incidentForm">

        <label for="description">Description:</label>
        <textarea id="description" rows="4" placeholder="Describe the incident..."></textarea>

        <!--  FULL LOCATION SYSTEM -->
        <label for="locationInput">Location (India):</label>
        <input type="text" id="locationInput" placeholder="Type city, area, landmark, or postal code" autocomplete="off">
        <div id="suggestions" style="display:none;"></div>

        <div class="location-options">
            <button type="button" class="secondary-btn" id="useGpsBtn">Use My Current Location</button>
            <button type="button" class="secondary-btn" id="manualCoordsBtn">Enter Coordinates Manually</button>
        </div>

        <div id="manualCoordsDiv" class="manual-coords">
            <p class="info-text">Enter latitude & longitude (e.g., Kochi: 9.9312, 76.2673)</p>

            <div class="coord-input">
                <label>Latitude:</label>
                <input type="number" id="manualLat" step="any" placeholder="e.g., 9.9312">
            </div>

            <div class="coord-input" style="float:right;">
                <label>Longitude:</label>
                <input type="number" id="manualLon" step="any" placeholder="e.g., 76.2673">
            </div>

            <div style="clear: both;"></div>
            <button type="button" class="secondary-btn" id="setManualCoords" style="margin-top: 10px;">Set Location</button>
        </div>

        <div id="selectedLocationDiv" style="display:none;" class="selected-location">
            <strong>Selected Location:</strong>
            <div id="selectedLocationText"></div>
            <div class="info-text" id="selectedLocationCoords"></div>
        </div>

        <!-- IMAGE INPUT -->
        <label>Upload Image:</label>
        <input type="file" id="imageFile" accept="image/*">

        <button type="submit">Submit Incident</button>
    </form>

    <script>
    window.addEventListener('DOMContentLoaded', () => {

        const contractAddress = "0x25Ef3FE515C6B0a9D2282A5D6e8A1ec99c1cFfDC";

        const contractABI = [
    {
        "anonymous": false,
        "inputs": [
            { "indexed": false, "internalType": "uint256", "name": "id", "type": "uint256" },
            { "indexed": false, "internalType": "string", "name": "lat", "type": "string" },
            { "indexed": false, "internalType": "string", "name": "lon", "type": "string" },
            { "indexed": false, "internalType": "string", "name": "ipfsHash", "type": "string" },
            { "indexed": false, "internalType": "uint256", "name": "timestamp", "type": "uint256" }
        ],
        "name": "IncidentReported",
        "type": "event"
    },
    {
        "anonymous": false,
        "inputs": [
            { "indexed": false, "internalType": "uint256", "name": "id", "type": "uint256" },
            { "indexed": false, "internalType": "uint256", "name": "timestamp", "type": "uint256" }
        ],
        "name": "IncidentVerified",
        "type": "event"
    },
    {
        "inputs": [],
        "name": "incidentCount",
        "outputs": [
            { "internalType": "uint256", "name": "", "type": "uint256" }
        ],
        "stateMutability": "view",
        "type": "function"
    },
    {
        "inputs": [
            { "internalType": "uint256", "name": "", "type": "uint256" }
        ],
        "name": "incidents",
        "outputs": [
            { "internalType": "uint256", "name": "id", "type": "uint256" },
            { "internalType": "string", "name": "lat", "type": "string" },
            { "internalType": "string", "name": "lon", "type": "string" },
            { "internalType": "string", "name": "ipfsHash", "type": "string" },
            { "internalType": "uint256", "name": "timestamp", "type": "uint256" },
            { "internalType": "bool", "name": "verified", "type": "bool" }
        ],
        "stateMutability": "view",
        "type": "function"
    },
    {
        "inputs": [
            { "internalType": "string", "name": "_lat", "type": "string" },
            { "internalType": "string", "name": "_lon", "type": "string" },
            { "internalType": "string", "name": "_ipfsHash", "type": "string" }
        ],
        "name": "reportIncident",
        "outputs": [],
        "stateMutability": "nonpayable",
        "type": "function"
    },
    {
        "inputs": [
            { "internalType": "uint256", "name": "_id", "type": "uint256" }
        ],
        "name": "verifyIncident",
        "outputs": [],
        "stateMutability": "nonpayable",
        "type": "function"
    },
    {
        "inputs": [
            { "internalType": "uint256", "name": "_id", "type": "uint256" }
        ],
        "name": "getIncident",
        "outputs": [
            { "internalType": "uint256", "name": "", "type": "uint256" },
            { "internalType": "string", "name": "", "type": "string" },
            { "internalType": "string", "name": "", "type": "string" },
            { "internalType": "string", "name": "", "type": "string" },
            { "internalType": "uint256", "name": "", "type": "uint256" },
            { "internalType": "bool", "name": "", "type": "bool" }
        ],
        "stateMutability": "view",
        "type": "function"
    }
];


        /*  DOM ELEMENTS */
        const locationInput = document.getElementById('locationInput');
        const suggestionsDiv = document.getElementById('suggestions');
        const selectedLocationDiv = document.getElementById('selectedLocationDiv');
        const selectedLocationText = document.getElementById('selectedLocationText');
        const selectedLocationCoords = document.getElementById('selectedLocationCoords');
        const manualLatInput = document.getElementById('manualLat');
        const manualLonInput = document.getElementById('manualLon');
        const imageFileInput = document.getElementById('imageFile');

        let selectedLocation = null;

        function updateSelectedLocation(name, lat, lon) {
            selectedLocation = { name, lat, lon };
            selectedLocationDiv.style.display = 'block';
            selectedLocationText.textContent = name;
            selectedLocationCoords.textContent = `Coordinates: ${lat}, ${lon}`;
        }

        function clearSelectedLocation() {
            selectedLocation = null;
            selectedLocationDiv.style.display = 'none';
            selectedLocationText.textContent = '';
            selectedLocationCoords.textContent = '';
        }

        /*  AUTOCOMPLETE WITH FALLBACKS */
        let debounceTimer;
        locationInput.addEventListener('input', async () => {
            clearTimeout(debounceTimer);
            clearSelectedLocation();

            const query = locationInput.value.trim();
            if (!query || query.length < 2) {
                suggestionsDiv.style.display = 'none';
                return;
            }

            debounceTimer = setTimeout(async () => {
                suggestionsDiv.innerHTML = '<div class="suggestion-item" style="color:#999;">Searching...</div>';
                suggestionsDiv.style.display = 'block';

                try {
                    const response = await fetch(
                        `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=in&limit=10&addressdetails=1`,
                        { headers: { 'User-Agent': 'IncidentReportApp/1.0' } }
                    );

                    let data = await response.json();
                    if (data.length === 0) {
                        const fb = await fetch(
                            `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + " India")}&limit=10&addressdetails=1`,
                            { headers: { 'User-Agent': 'IncidentReportApp/1.0' } }
                        );
                        data = await fb.json();
                    }

                    suggestionsDiv.innerHTML = '';
                    if (data.length === 0) {
                        suggestionsDiv.innerHTML =
                            '<div class="suggestion-item" style="color:#999;">No locations found.</div>';
                        return;
                    }

                    data.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'suggestion-item';
                        div.textContent = item.display_name;
                        div.addEventListener('click', () => {
                            locationInput.value = item.display_name;
                            updateSelectedLocation(item.display_name, item.lat, item.lon);
                            suggestionsDiv.style.display = 'none';
                        });
                        suggestionsDiv.appendChild(div);
                    });

                } catch (err) {
                    console.error('Location search error:', err);
                    suggestionsDiv.innerHTML =
                        '<div class="suggestion-item" style="color:#999;">Search unavailable. Use GPS or manual.</div>';
                }
            }, 400);
        });

        document.addEventListener('click', (e) => {
            if (e.target !== locationInput) suggestionsDiv.style.display = 'none';
        });

        /* ⭐ USE GPS */
        document.getElementById('useGpsBtn').addEventListener('click', () => {
            if (!navigator.geolocation) return alert('GPS not supported.');

            const btn = document.getElementById('useGpsBtn');
            btn.textContent = '📍 Getting location...';
            btn.disabled = true;

            navigator.geolocation.getCurrentPosition(async (pos) => {
                const lat = pos.coords.latitude.toFixed(6);
                const lon = pos.coords.longitude.toFixed(6);

                try {
                    const res = await fetch(
                        `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`,
                        { headers: { 'User-Agent': 'IncidentReportApp/1.0' } }
                    );
                    const data = await res.json();
                    const name = data.display_name || `GPS (${lat}, ${lon})`;

                    locationInput.value = name;
                    updateSelectedLocation(name, lat, lon);

                } catch (err) {
                    console.error('Reverse geocode error:', err);
                    locationInput.value = `GPS (${lat}, ${lon})`;
                    updateSelectedLocation("GPS Location", lat, lon);
                }

                btn.textContent = 'Use My Current Location';
                btn.disabled = false;
            }, (err) => {
                alert('GPS error: ' + err.message);
                btn.textContent = 'Use My Current Location';
                btn.disabled = false;
            });
        });

        /*  MANUAL COORDINATES */
        document.getElementById('manualCoordsBtn').addEventListener('click', () => {
            const div = document.getElementById('manualCoordsDiv');
            div.style.display = (div.style.display === 'none' || div.style.display === '') ? 'block' : 'none';
        });

        document.getElementById('setManualCoords').addEventListener('click', () => {
            const lat = manualLatInput.value.trim();
            const lon = manualLonInput.value.trim();

            if (!lat || !lon) return alert('Enter both fields.');

            locationInput.value = `Manual Location (${lat}, ${lon})`;
            updateSelectedLocation("Manual Location", lat, lon);
            document.getElementById('manualCoordsDiv').style.display = 'none';
        });

        /*  IPFS UPLOAD */
        async function uploadToIPFS(file) {
            const url = "https://api.pinata.cloud/pinning/pinFileToIPFS";
            let data = new FormData();
            data.append("file", file);

            const response = await fetch(url, {
                method: "POST",
                headers: {
                    Authorization: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySW5mb3JtYXRpb24iOnsiaWQiOiI1MzhmZTk4OS00NjE2LTQ1YjgtYmZkMy0xNjMzZjQzNTAyMGYiLCJlbWFpbCI6InNpb25hMzg3MEBnbWFpbC5jb20iLCJlbWFpbF92ZXJpZmllZCI6dHJ1ZSwicGluX3BvbGljeSI6eyJyZWdpb25zIjpbeyJkZXNpcmVkUmVwbGljYXRpb25Db3VudCI6MSwiaWQiOiJGUkExIn0seyJkZXNpcmVkUmVwbGljYXRpb25Db3VudCI6MSwiaWQiOiJOWUMxIn1dLCJ2ZXJzaW9uIjoxfSwibWZhX2VuYWJsZWQiOmZhbHNlLCJzdGF0dXMiOiJBQ1RJVkUifSwiYXV0aGVudGljYXRpb25UeXBlIjoic2NvcGVkS2V5Iiwic2NvcGVkS2V5S2V5IjoiZTUxZDNkNGQwMzI0N2M2NjZjNjMiLCJzY29wZWRLZXlTZWNyZXQiOiIyOTljM2FmMWExNmMwYWU0MjFiYTVjYTU2MzVmNjZkYWI2NzAyYjdlMTNkNWU1YzNhMzE4YTA5ODllYTIxNWY5IiwiZXhwIjoxNzk1OTY0OTkxfQ.M2Vn2DsGjeadx5gsU8jMnOalKdJKdi7ohAVBOGnId0o"
                },
                body: data
            });

            if (!response.ok) {
                const txt = await response.text();
                console.error('IPFS upload failed:', txt);
                throw new Error('IPFS upload failed');
            }

            const result = await response.json();
            if (!result.IpfsHash) {
                console.error('No IpfsHash in response:', result);
                throw new Error('No CID returned from IPFS');
            }

            return result.IpfsHash;
        }

        /*  FORM SUBMISSION */
        document.getElementById('incidentForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const descriptionText = document.getElementById('description').value.trim();
            if (!descriptionText) return alert('Enter a description.');

            if (!selectedLocation) return alert("Choose a location (search, GPS, or manual)");

            const file = imageFileInput.files[0];
            if (!file) return alert("Upload an image");

            if (!window.ethereum) return alert('MetaMask not found.');

            try {
                const ipfsHash = await uploadToIPFS(file);
                alert("CID: " + ipfsHash);

                const web3 = new Web3(window.ethereum);
                await ethereum.request({ method: 'eth_requestAccounts' });
                const account = (await web3.eth.getAccounts())[0];
                const contract = new web3.eth.Contract(contractABI, contractAddress);

                contract.methods.reportIncident(
                    selectedLocation.lat,
                    selectedLocation.lon,
                    ipfsHash
                )
                .send({ from: account, gas: 300000 })
                .on('receipt', async receipt => {

                    const txHash = receipt.transactionHash;

                    try {
                        await fetch("http://localhost:8000/saveIncident", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                wallet: account,
                                description: descriptionText,
                                location: selectedLocation.name,
                                txHash: txHash,
                                imageCID: ipfsHash
                            })
                        });
                    } catch (err) {
                        console.error('Error saving to backend:', err);
                    }

                    alert("Incident reported!");

                    document.getElementById('description').value = "";
                    locationInput.value = "";
                    imageFileInput.value = "";
                    clearSelectedLocation();
                })
                .on('error', (err) => {
                    alert('Transaction failed: ' + err.message);
                });

            } catch (err) {
                console.error(err);
                alert("Error: " + err.message);
            }
        });

    });
    </script>
</body>
</html>
